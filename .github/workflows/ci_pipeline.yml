name: Pipeline de Integracao Continua (CI)

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main", "master", "develop" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validar HTML, CSS e JS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Validadores Globais
        run: npm install -g htmlhint stylelint stylelint-config-standard eslint

      - name: Validar Arquivos HTML
        run: |
          htmlhint "**/*.html" --ignore "venv/**,.git/**,node_modules/**" || echo "Validação HTML concluída com avisos"

      - name: Validar Arquivos CSS
        run: |
          npx stylelint "**/*.css" --ignore-path .gitignore --config stylelint-config-standard || echo "Validação CSS concluída com avisos"

      - name: Validar Arquivos JavaScript
        run: |
          npx eslint "**/*.js" --ignore-pattern "venv/**" --ignore-pattern "node_modules/**" --env browser --syntax-ecma-version 2020 || echo "Validação JS concluída com avisos"
