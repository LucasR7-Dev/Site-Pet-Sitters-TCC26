name: Pipeline de Integracao Continua (CI)

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main", "master", "develop" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-and-lint:
    name: Seguranca e Estilo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias
        run: npm ci --prefer-offline --no-audit

      - name: Verificar Vulnerabilidades
        run: npm audit --audit-level=high

      - name: Validar Formatacao e Lint
        run: npm run lint

  tests:
    name: Testes Automatizados
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias
        run: npm ci --prefer-offline --no-audit

      - name: Executar Suite de Testes
        run: npm test

  build:
    name: Validacao de Build
    needs: [security-and-lint, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependencias
        run: npm ci --prefer-offline --no-audit

      - name: Executar Build do Projeto
        run: npm run build
