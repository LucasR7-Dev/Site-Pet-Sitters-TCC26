<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encontre um cuidador</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
    <style>
        .hero-title{
            text-align: center; /*Centraliza o texto*/
            margin-top: 80px;   /*Espaço abaixo do header*/
            font-family: sans-serif;    /*Use a mesma fonte do style.css*/
            font-size: 58px;    /* Tamannho grande como na imagem*/
            font-weight: bold;
            color: #333; /*Cor cinza escuro/ preto*/
        }
        .hero-title span{
            color: #40c1ac; /*Verde agua da identidade visual*/
        }
        .container{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
        }
        /*Criando coluna*/
        .main-content-container{
            display: flex; /*Faz os filhos (aside e section) ficarem lado a lado*/
            gap: 30px; /*Espaço entre o filtro e os resultado*/
            margin-top: 40px; /*Espaço em relação ao titulo la em cima*/
            align-items: flex-start; /*alinha o filtro no top*/
        }
        /*Estilizando a Aba latera*/
        
        /*Organizando os grupos de filtro*/
        .filter-group{
            margin-bottom: 20px; /*Espaço entre cada bloco de filtro*/
            display: flex;
            flex-direction: column;/*faz os checbox ficarem um abaixo do outro*/
    
        }
        .filter-group h4{
            margin-bottom: 10px;
            font-size: 16px;
            color: #333;
        }
        
        .filter-group label{
            font-size: 10px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        /*Estilo para o campo de texto da cidade*/
        .input-cidade{
            padding: 8px;
            border:1px solid #ccc;
            border-radius:5px;
            margin-bottom:10px;
        }
        .input-estado{
            padding: 8px;
            border:1px solid #ccc;
            border-radius:5px;
            margin-bottom:10px;
        }
        select.input-estado{
            appearance: none; /*removendo a seta padrão do navegador*/
            background-color: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 15px;
            padding-right: 35px; /*Tamanho da barra de estado e cidades*/
        }

        select.input-cidade{
            appearance: none; /*removendo a seta padrão do navegador*/
            background-color: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 15px;
            padding-right: 35px; /*Tamanho da barra de estado e cidades*/
        }
        /*Estilizando o checkbox*/
        .filter-group label{
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.33s;
        }

        .side-bar-filter{
            position: fixed;
            top: 260px;
            left: 10px;
            position: absolute;
            background-color: #fd83318c; /*Um cinza bem clarinho para destacar*/
            border-radius: 15px;
            box-shadow: 0 4px 5px rgba(0,0,0,0,0.05);
            border: 2px solid #863100;
            height: auto;

        }

        

        .Card-cuidadores-encontrados{
            margin-top: 2%;
            margin-left: 15%;
            width: 100%;
            display: flex;
            
            
        }
        .minimal-card{
            margin-top: auto;
            margin-left: 5%;
            width: auto;
            display: grid;
            display: inline-block;

        }
        div.show-sidebar{
            display: none;
            border-left: 30px, solid orangered;
            border-top: 30px, solid transparent;
            border-bottom: 30px,solid transparent;
            margin-top: 20px;
            position: fixed;
            cursor: pointer;
            top: 90px;
        }
        @media screen and (max-width: 1024px){
            section.Card-cuidadores-encontrados{
                width: 100%;
                margin-left: 0;
                margin-top: 65%;
            }
            nav.side-bar-filter{
                margin-top: 25%;
                display: inline-block;
                width: auto;
                height: auto;
                align-items: center;
                
            }
            .filter-group{
                flex-direction: row;
            }
            .input-cidade{
            margin-right: 5px;
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: auto;
            padding-right: 35px; /*Tamanho da barra de estado e cidades*/
            }
            select.input-cidade{
                margin-right: 35px;
            }


        }
        
    </style>
    <header>
        <nav class="container">
            <div class="logo">Pet<span>Mee</span></div>
            <div class="nav-links">
                <a href="#explorar">Encontrar Cuidadores</a>
                <a href="#como-funciona">Como funciona</a>
                <button class="btn-primary">Ser um Cuidador</button>
            </div>
        </nav>
    </header>
    <main>
        <!--Meio do site-->
        <h1 class="hero-title">Encontrar um <span>Cuidador</span></h1>
    </main>
    <nav class="side-bar-filter">
        <div class="show-sidebar"></div>
        <aside class="Filter">
            <h3>Filtros</h3>
            <div class="filter-group">
            <h4>Gênero</h4>
                <label><input type="radio" name="genero" value="masculino">Masculino</label>
                <label><input type="radio" name="genero" value="feminino">Feminino</label>
            </div>

            <div class="filter-group">
                <h4>Idade do Cuidador</h4>
                <label><input type="checkbox" value="jovem" > 18-25</label>
                <label><input type="checkbox" value="adulto" > 26-40</label>
                <label><input type="checkbox" value="experiente"> 40+</label>
            </div>
            <div class="filter-group">
                <h4>Localização</h4>
                <label for="estado">Estado</label>
                <select id="estado" class="input-estado">
                    <option value="">Selecione o Estado</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </select>
                
                <label for="cidade">Cidade::</label>
                <select id="cidade" class="input-cidade">
                    <option value="">Selecione o Estado primeiro</option>
                </select>
            </div>
        </aside>
        <section class="results">
            <p>Os cuidadores aparecerão aqui...</p>
        </section>
    </nav>
    <script>
        const selectEstado = document.getElementById('estado');
        const selectCidade = document.getElementById('cidade');
        // Função para carregar os Estados ao abrir a pagina
        async function carregarEstado(){
            const response = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome')
            const estados = await response.json();

            estados.forEach(estado => {
                const option = document.createElement('option');
                option.value = estado.sigla;
                option.textContent = estado.nome;
                selectEstado.appendChild(option)
            });
        }
        //Função para carregar cidades qquando o estado mudar
        selectEstado. addEventListener('change', async() =>{
            const sigla = selectEstado.value;
            selectCidade.innerHTML = '<option value="">Carregando...</option>';

            if (!sigla){
                selectCidade.innerHTML = '<option value=""> Seleciobe o Estado primeiro</option>'
                return;
            }

            const response = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${sigla}/municipios`)
            const cidades = await response.json();

            selectCidade.innerHTML= '<option value="">Selecione a Cidade</option>';
            cidades.forEach(cidade => {
                const option = document.createElement('option');
                option.value = cidade.nome;
                option.textContent = cidade.nome;
                selectCidade.appendChild(option);
            })
        });
        //inicializa a lista de estados
        carregarEstado();
    </script>
    <!--Cards dos cuidadores filtrados-->
    <section class="Card-cuidadores-encontrados">
        <div class="minimal-card">
            <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1576201836106-db1758fd1c97?q=80&w=500&auto=format&fit=crop')"></div>

            <div class="card-details">
                <span class="category">Hospedagem</span>
                <h3>Clínica Pet Amigo</h3>
                <p class="location">Moema, SP • ⭐ 5.0</p>
                <div class="card-meta">
                    <strong class="price">R$ 120<em>/noite</em></strong> <!--Tirei o span e o 'a' e coloquei tegs semanticas strong e 'em', com tags semanticas o HTML entende melhor qual parte é do site-->
                    <a href="#" class="view-more">Ver Perfil →</a>
                </div>
            </div>
        </div>
        <div class="minimal-card">
            <div class="card-img" style="background-image: url('https://images.unsplash.com/photo-1576201836106-db1758fd1c97?q=80&w=500&auto=format&fit=crop')"></div>

            <div class="card-details">
                <span class="category">Hospedagem</span>
                <h3>Marcos</h3>
                <p class="location">Santos, SP • ⭐ 5.0</p>
                <div class="card-meta">
                    <strong class="price">R$ 100<em>/noite</em></strong> <!--Tirei o span e o 'a' e coloquei tegs semanticas strong e 'em', com tags semanticas o HTML entende melhor qual parte é do site-->
                    <a href="#" class="view-more">Ver Perfil →</a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
