<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PetMee | Perfil de: Senhor Bigodes 🐱</title>
  <link rel="stylesheet" href="../../css/perfil/perfil3.css">
</head>

<body>

<div class="card">

  <div class="image-container">
    <img src="../../pets/GA1.png">

    <div class="overlay">
      <h2>Senhor Bigodes 🐱</h2>
      <div class="tags">
        <div class="tag">Macho</div>
        <div class="tag">Pequeno</div>
        <div class="tag">5 anos</div>
      </div>
    </div>
  </div>

  <div class="content">

    <div class="section">
      <div class="label">Raça</div>
      <div class="value">Vira-Lata Tricolor</div>
    </div>

    <div class="section">
      <div class="label">Localização</div>
      <div class="value">Barueri, SP • ⭐ 5.0</div>
    </div>

    <div class="section">
      <div class="label">Status</div>
      <div class="status">Disponível</div>
    </div>

    <div class="section">
      <div class="label">Saúde</div>
      <div class="value">✔ Vacinado &nbsp;&nbsp; ✔ Castrado</div>
    </div>

    <div class="section">
      <div class="label">Sobre</div>
      <div class="value">
        Muito Calmo, ama dormir e brincar com pelúcias. Ideal para quem gosta de pets melosos e carinhosos.
      </div>
    </div>

    <div class="buttons">
      <button class="accept" onclick="alert('Pedido enviado! 🐾')">Quero cuidar ❤️</button>
      <button class="reject" onclick="alert('Prepare o coração... Lá vem mais uma fofura! 🐾')">Conhecer outro pet</button>
    </div>

  </div>

</div>

</body>
</html>
