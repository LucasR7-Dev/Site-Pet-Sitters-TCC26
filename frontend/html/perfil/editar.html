{% load static %}
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar perfil | PetMee</title><link rel="stylesheet" href="{% static 'perfil/perfil_usuario.css' %}"></head><body><main><section class="review-form"><h1>Editar perfil</h1>{% for message in messages %}<p>{{ message }}</p>{% endfor %}<form method="post">{% csrf_token %}<input name="nome_completo" value="{{ perfil.nome_completo }}" required placeholder="Nome completo"><input name="cidade" value="{{ perfil.cidade|default:'' }}" placeholder="Cidade"><input name="estado" value="{{ perfil.estado|default:'' }}" placeholder="Estado"><input name="idade" value="{{ perfil.idade|default:'' }}" type="number" min="0" placeholder="Idade"><input name="avatar_url" value="{{ perfil.avatar_url|default:'' }}" type="url" placeholder="URL da foto"><textarea name="bio" placeholder="Conte sobre você">{{ perfil.bio|default:'' }}</textarea><button type="submit">Salvar alterações</button></form></section></main></body></html>
