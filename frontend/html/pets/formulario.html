{% load static %}
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastrar pet | PetMee</title><link rel="stylesheet" href="{% static 'perfil/perfil1.css' %}"></head><body><main class="card"><article class="content"><h1>Cadastre seu pet</h1><p class="label">Essas informações serão exibidas para os cuidadores.</p>{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}<form method="post" class="pet-form">{% csrf_token %}<label>Nome<input name="nome" required></label><label>Espécie<input name="especie" placeholder="Cão, gato..." required></label><label>Raça<input name="raca"></label><label>Sexo<select name="sexo"><option>Fêmea</option><option>Macho</option><option>Não informado</option></select></label><label>Porte<select name="porte"><option>Pequeno</option><option>Médio</option><option>Grande</option></select></label><label>Idade<input name="idade" placeholder="Ex.: 3 anos"></label><label>Localização<input name="localizacao" placeholder="Cidade, UF" required></label><label>Saúde<input name="saude" placeholder="Vacinas, alergias e cuidados"></label><label>URL da foto<input name="foto_url" type="url" placeholder="https://..."></label><label>Sobre<textarea name="sobre" rows="4" placeholder="Temperamento, rotina e necessidades"></textarea></label><button class="accept" type="submit">Salvar pet</button><a class="reject" href="{% url 'home' %}">Cancelar</a></form></article></main></body></html>
